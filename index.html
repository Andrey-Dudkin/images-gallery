<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Галерея фотографий</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="navbar">
          <div class="navbar__body">
            <div class="navbar__logo logo">
              <p class="logo__text">Галерея</p>
            </div>
            <div class="navbar__controls">
              <button type="button" class="btn navbar__btn">Загрузить</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <h1 class="visually-hidden">>Галерея фотографий</h1>
      <h2 class="visually-hidden">>Галерея фотографий</h2>
      <section class="gallery">
        <div class="container">
          <div class="gallery__grid">
            <a href="#" class="gallery__card card">
              <img
                src="./img/img-01.jpg"
                alt="Горное озеро"
                class="card__img"
              />
              <div class="card__text">
                <h3 class="card__title">Горное озеро</h3>
                <time datetime="2026-06-12" class="card__date"
                  >12 Июня 2026</time
                >
              </div>
            </a>
            <a href="#" class="gallery__card card">
              <img
                src="./img/img-02.jpg"
                alt="Ночной город"
                class="card__img"
              />
              <div class="card__text">
                <h3 class="card__title">Ночной город</h3>
                <time datetime="2026-06-10" class="card__date"
                  >10 Июня 2026</time
                >
              </div>
            </a>
            <a href="#" class="gallery__card card">
              <img
                src="./img/img-03.jpg"
                alt="Океанский пляж"
                class="card__img"
              />
              <div class="card__text">
                <h3 class="card__title">Океанский пляж</h3>
                <time datetime="2026-06-08" class="card__date"
                  >8 Июня 2026</time
                >
              </div>
            </a>
            <a href="#" class="gallery__card card">
              <img
                src="./img/img-04.jpg"
                alt="Лесная тропа"
                class="card__img"
              />
              <div class="card__text">
                <h3 class="card__title">Лесная тропа</h3>
                <time datetime="2026-06-06" class="card__date"
                  >6 Июня 2026</time
                >
              </div>
            </a>
            <a href="#" class="gallery__card card">
              <img src="./img/img-05.jpg" alt="Водопад" class="card__img" />
              <div class="card__text">
                <h3 class="card__title">Водопад</h3>
                <time datetime="2026-06-04" class="card__date"
                  >4 Июня 2026</time
                >
              </div>
            </a>
            <a href="#" class="gallery__card card">
              <img
                src="./img/img-06.jpg"
                alt="Городские улицы"
                class="card__img"
              />
              <div class="card__text">
                <h3 class="card__title">Городские улицы</h3>
                <time datetime="2026-06-02" class="card__date"
                  >2 Июня 2026</time
                >
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
